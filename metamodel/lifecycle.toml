# Lifecycle states and the transitions a commit may make. The checker diffs the previous
# commit's state against this table; a skipped transition fails the check.

states = ["draft", "proposed", "approved", "deprecated", "retired", "rejected"]

[transitions]
draft = ["proposed", "retired"]
proposed = ["approved", "rejected", "draft"]
approved = ["deprecated"]
deprecated = ["retired", "approved"]
rejected = ["draft"]
retired = []

[approval]
four_eyes = true              # the approver may not be the pull request's author
cross_domain_both_owners = true

[review]
default_months = 12
overdue_is_error = false     # a warning in the report unless a kind says otherwise

[review.kinds]
capability = { months = 12 }
product = { months = 6 }
# Decision 0013: the kinds a key on the API's response rests on. Where the shipper meets
# the product, at the product's cadence; the module and the entity beneath, at the capability's.
step = { months = 6 }
touchpoint = { months = 6 }
module = { months = 12 }
business_entity = { months = 12 }

# Knowledge a person gave is reviewed sooner than knowledge a document or an export carries
# (decision 0008): a link with an `elicited` block is due for review within this many months of
# the day it was given, whatever its type's default.
[review.evidence]
elicited = { months = 6 }
